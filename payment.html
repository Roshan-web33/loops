<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
     <div class="payament-section">
        <div class="check-out">
            <p>Check Out</p>
            <div class="contact">
                <h3>Contact Details</h3>
                <label>Email ID</label>
                <br>
                <input placeholder="Email id">
            </div>
            <div class="payments">
                <h3>Payment</h3>
                <div class="opations">
                    <div class="types">
                        <div class="card">
                            <img width="25px"src="credit-card-fill.svg" alt="">
                            <br>
                            card
                        </div>
                        <div class="bank">
                            <img width="25px" src="bank.svg" alt="">
                            <br>
                            Bank
                        </div>
                        <div class="crypto">
                            <img width="25px" src="currency-bitcoin.svg" alt="">
                            <br>
                            Crypto
                        </div>
                        <div  class="three">
                            <img width="25px" src="three-dots-vertical.svg" alt="">
                            
                    </div>

                        </div>
                        <div class="card-input"><label>Card Number</label>
                         <br>
                <input placeholder="123XXXXXX" required></div> 
                <div class="card-detail">
                    <label >Expiry</label><br> 
                    <input class="Expiry" placeholder="MM/YY">
                    
                </div>

                <div id="cvc">
                    <label id="13">CVC</label><br>
                    <input class="cvc" placeholder="...." required>
                </div>
                <div class="card-detail2">
                    <label id="14">Country</label><br>
                    <select class="country" name="country" required  >
                    <option value="1">USA</option>
                    <option value="2">RUSSIA</option>
                    <option value="3">OTHER</option>
                    </select>
                    
                </div>

                <div id="zip">
                    <label >ZIP</label><br>
                    <input class="zip" name="zip" required placeholder="xxxxx">
                </div>
                
                

                         
                           
                        
                </div>
            </div>
        </div>
        <div class="oder-summary">
            <h3>Order Summary</h3>
            <div class="payment">
            <div class="payment-container">
            <p>Enter Coupan Code</p>
            <div class="coupan">
                  <input class="input-coupan" placeholder="COUPAN CODE">
                  <button class="apply-btn">Apply Coupan</button>
                <div class="list">
                    <div class="list-1">

                    <ul>
                    <li>Sub Total</li>
                    <li>Taxes</li>
                    <li>Discount</li>
                    <li>Total</li>
                  </ul>
                    </div>
                  <div class="list-2">
                    <ul>
                    <li>$4,700</li>
                    <li>$1,900</li>
                    <li>$0</li>
                    <li>$4,999</li>
                  </ul>
                  </div>
                  </div>

            </div>
            </div>

            <button class="pay-btn">Pay Now $4,999</button>
            <div class="icon">
                <img src="Screenshot 2026-03-14 at 6.03.55 PM.png" alt="">

            </div>

        </div>

        
     </div>
 </body>
 </html>
    
</body>
</html>
